spring.application.name=binance-price-service

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/binance}
spring.datasource.username=${DB_USER:binance}
spring.datasource.password=${DB_PASSWORD:binance}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Timeouts
binance.connect-timeout=${BINANCE_CONNECT_TIMEOUT:3s}
binance.read-timeout=${BINANCE_READ_TIMEOUT:5s}
binance.default-retry-after=${BINANCE_DEFAULT_RETRY_AFTER:30s}

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Binance
binance.base-url=${BINANCE_BASE_URL:https://api.binance.com}
binance.symbol=${BINANCE_SYMBOL:BNBUSDT}
binance.poll-interval=${BINANCE_POLL_INTERVAL:PT30S}
binance.trend-flat-threshold=${BINANCE_TREND_FLAT_THRESHOLD:0.001}

# Server
server.port=8080

# Error
server.error.include-stacktrace=never
server.error.include-message=always

spring.jackson.serialization.write-dates-as-timestamps=false

